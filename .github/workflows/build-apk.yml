name: Build Android APK from Web Source

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Web Directory & Stage Assets
        run: |
          set -ex
          mkdir -p www
          
          # Find main entrypoint html file or create index.html
          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            MAIN_HTML=$(ls *.html 2>/dev/null | head -n 1)
            if [ -n "$MAIN_HTML" ]; then
              cp "$MAIN_HTML" www/index.html
            else
              echo "<!DOCTYPE html><html><head><title>App</title></head><body><h1>App Loaded</h1></body></html>" > www/index.html
            fi
          fi

          # Copy remaining assets into webDir
          cp -r *.html *.css *.js assets manifest.json www/ 2>/dev/null || true

      - name: Initialize Web App & Capacitor Wrapper
        run: |
          set -ex
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          cat << 'CJSON' > capacitor.config.json
          {
            "appId": "com.quicknotes.app",
            "appName": "QuickNotes",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          CJSON

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap copy android
          npx cap update android

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
