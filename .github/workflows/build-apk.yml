name: Build Android APK from Web Source

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize Web App & Capacitor Wrapper
        run: |
          set -ex
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/android

          if [ ! -f capacitor.config.json ]; then
            cat << 'CJSON' > capacitor.config.json
          {
            "appId": "com.quicknotes.app",
            "appName": "QuickNotes",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          CJSON
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap copy android
          npx cap update android

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
