name: Build Android APK from Web Source

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize Web App & Capacitor Wrapper
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Initialize Capacitor project if android/ folder does not exist
          if [ ! -d "android" ]; then
            npx cap init "GemmaApp" "com.gemma.app" --web-dir "."
            npx cap add android
          fi

          # Sync web assets into Android native assets
          npx cap copy android

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            *.apk
            *.html
            *.css
            *.js
          if-no-files-found: error
