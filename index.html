<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NightNotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>NightNotes</h1>
            <button id="add-note-btn" class="fab">+</button>
        </header>

        <main id="notes-list">
            <!-- Notes will be injected here -->
        </main>

        <div id="note-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <button id="close-modal">✕</button>
                    <input type="text" id="note-title" placeholder="Title..." autofocus>
                    <button id="save-note-btn">Save</button>
                </div>
                <textarea id="note-body" placeholder="Start typing your thoughts..."></textarea>
            </div>
        </div>
        <div id="modal-overlay" class="overlay"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
